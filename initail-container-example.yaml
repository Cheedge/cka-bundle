apiVersion: v1
kind: Pod
metadata:
  name: db-init-pod
spec:
  initContainers:
  - name: init-db
    image: postgres:latest
    command: ["sh", "-c"]
    args:
      - |
        until pg_isready -h postgres -U user; do
          echo "Waiting for PostgreSQL to be ready...";
          sleep 2;
        done;
        psql -h postgres -U user -d mydb -c "CREATE TABLE IF NOT EXISTS test (id SERIAL PRIMARY KEY, name TEXT);"
    env:
    - name: PGPASSWORD
      value: "password" # Match the PostgreSQL password
  containers:
  - name: app
    image: busybox
    command: ["/bin/sh", "-c"]
    args: ["echo 'App starting'; sleep 3600"]


---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        env:
        - name: POSTGRES_USER
          value: "user"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "mydb"
        ports:
        - containerPort: 5432
        
